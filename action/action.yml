name: TomorrowCI
description: Continuous Integration Against the Future — scan for breakage horizons
author: TomorrowCI Contributors

branding:
  icon: activity
  color: blue

inputs:
  path:
    description: Repository path to scan
    required: false
    default: "."
  config:
    description: Optional path to .tomorrowci.yml
    required: false
    default: ""
  advisory:
    description: Softens horizon regression policy only; never converts BLOCKED to PASS
    required: false
    default: "true"
  base-run-id:
    description: Optional base run id for horizon comparison
    required: false
    default: ""
  expect-horizon:
    description: Require baseline PASS + FUTURE_FAIL + signature + observed + verify PASS
    required: false
    default: "false"

outputs:
  run-id:
    description: TomorrowCI run id
    value: ${{ steps.scan.outputs.run_id }}
  frontier-observed:
    description: Whether a breakage horizon was observed
    value: ${{ steps.scan.outputs.frontier_observed }}

runs:
  using: composite
  steps:
    - name: Locate or build CLI from action repository
      id: bin
      shell: bash
      run: |
        set -euo pipefail
        ACTION_ROOT="$(cd "${{ github.action_path }}/.." && pwd)"
        # Isolate source directories and always let Cargo validate freshness.
        # A pre-existing executable is not evidence that it matches this action.
        SOURCE_KEY="$(printf '%s' "$ACTION_ROOT" | sha256sum | cut -c1-24)"
        TARGET_DIR="${RUNNER_TEMP:-/tmp}/tomorrowci-target-$SOURCE_KEY"
        mkdir -p "$TARGET_DIR"
        BIN="$TARGET_DIR/release/tomorrowci"
        echo "Building tomorrowci-cli from action root: $ACTION_ROOT"
        cargo build -p tomorrowci-cli --release --locked --manifest-path "$ACTION_ROOT/Cargo.toml" --target-dir "$TARGET_DIR"
        test -x "$BIN"
        echo "bin=$BIN" >> "$GITHUB_OUTPUT"
        echo "action_root=$ACTION_ROOT" >> "$GITHUB_OUTPUT"

    - name: Trust audit
      shell: bash
      run: |
        set -euo pipefail
        "${{ steps.bin.outputs.bin }}" trust

    - name: Scan
      id: scan
      shell: bash
      env:
        TCI_INPUT_CONFIG: ${{ inputs.config }}
        TCI_INPUT_EXPECT_HORIZON: ${{ inputs.expect-horizon }}
        TCI_INPUT_PATH: ${{ inputs.path }}
      run: |
        set -euo pipefail
        BIN="${{ steps.bin.outputs.bin }}"
        CFG_ARGS=()
        if [[ -n "$TCI_INPUT_CONFIG" ]]; then
          CFG_ARGS+=(--config "$TCI_INPUT_CONFIG")
        fi
        SCAN_PATH="$TCI_INPUT_PATH"
        CODE=0
        if OUT=$("$BIN" scan "$SCAN_PATH" "${CFG_ARGS[@]}" 2>&1); then
          CODE=0
        else
          CODE=$?
        fi
        echo "$OUT"
        RUN_ID=$(echo "$OUT" | sed -n 's/^run_id: //p' | tail -1)
        if [[ ! "$RUN_ID" =~ ^[0-9a-f]{12}$ ]]; then
          echo "Scan did not emit one canonical run id" >> "$GITHUB_STEP_SUMMARY"
          exit 1
        fi
        RUN_DIR="$SCAN_PATH/.tomorrowci/runs/$RUN_ID"
        if [[ ! -d "$RUN_DIR" ]]; then
          echo "Exact evidence run directory was not produced" >> "$GITHUB_STEP_SUMMARY"
          exit 1
        fi
        echo "run_id=$RUN_ID" >> "$GITHUB_OUTPUT"
        echo "run_dir=$RUN_DIR" >> "$GITHUB_OUTPUT"
        export RUN_DIR
        if [[ -f "${RUN_DIR}/job-summary.md" ]]; then
          cat "${RUN_DIR}/job-summary.md" >> "$GITHUB_STEP_SUMMARY"
        fi
        if ! (cd "$SCAN_PATH" && "$BIN" verify "$RUN_ID"); then
          echo "evidence verify failed" >> "$GITHUB_STEP_SUMMARY"
          exit 1
        fi
        eval "$(python3 "${{ github.action_path }}/parse-evidence.py" "$RUN_DIR")"
        if [[ "${TCI_BLOCKED:-0}" == "1" ]]; then
          echo "Scan produced BLOCKED scenario(s)." >> "$GITHUB_STEP_SUMMARY"
          exit 2
        fi
        if [[ "$CODE" -ne 0 ]]; then
          echo "Unexpected scan exit code $CODE" >> "$GITHUB_STEP_SUMMARY"
          exit "$CODE"
        fi
        if [[ "$TCI_INPUT_EXPECT_HORIZON" == "true" ]]; then
          if [[ "${TCI_BASELINE_PASS:-0}" != "1" || "${TCI_FUTURE_FAIL:-0}" != "1" || "${TCI_SIG:-0}" != "1" || "${TCI_FO:-0}" != "1" || "${TCI_OBSERVED_GRADE:-0}" != "1" ]]; then
            echo "expect-horizon failed baseline=$TCI_BASELINE_PASS future=$TCI_FUTURE_FAIL sig=$TCI_SIG fo=$TCI_FO observed_grade=$TCI_OBSERVED_GRADE" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
        fi

    - name: Upload evidence
      if: always()
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
      with:
        name: tomorrowci-evidence-${{ steps.scan.outputs.run_id || 'unknown' }}
        path: ${{ steps.scan.outputs.run_dir }}
        if-no-files-found: error

    - name: Compare horizons
      if: ${{ inputs.base-run-id != '' }}
      shell: bash
      env:
        TCI_ADVISORY: ${{ inputs.advisory }}
        TCI_BASE_RUN_ID: ${{ inputs.base-run-id }}
        TCI_INPUT_PATH: ${{ inputs.path }}
      run: |
        set -euo pipefail
        BIN="${{ steps.bin.outputs.bin }}"
        HEAD="${{ steps.scan.outputs.run_id }}"
        set +e
        (cd "$TCI_INPUT_PATH" && "$BIN" compare --base "$TCI_BASE_RUN_ID" --head "$HEAD" --gate)
        CODE=$?
        set -e
        if [[ "$CODE" -eq 0 ]]; then
          exit 0
        fi
        if [[ "$CODE" -eq 3 && "$TCI_ADVISORY" == "true" ]]; then
          echo "Horizon policy regressed; advisory mode does not fail this job." >> "$GITHUB_STEP_SUMMARY"
          exit 0
        fi
        # Verification, malformed evidence, and internal failures are never
        # softened by advisory mode.
        exit "$CODE"

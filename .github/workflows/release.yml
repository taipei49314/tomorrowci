name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run (no GitHub release upload)"
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact: tomorrowci-x86_64-unknown-linux-gnu
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: tomorrowci-x86_64-pc-windows-msvc
          - os: macos-latest
            target: x86_64-apple-darwin
            artifact: tomorrowci-x86_64-apple-darwin
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: dtolnay/rust-toolchain@stable
      - name: Build
        run: cargo build -p tomorrowci --release
      - name: Package (unix)
        if: runner.os != 'Windows'
        run: |
          stage=dist/${{ matrix.artifact }}
          mkdir -p "$stage"
          cp target/release/tomorrowci "$stage/"
          cp README.md LICENSE CHANGELOG.md "$stage/"
          (cd dist && tar -czf ${{ matrix.artifact }}.tar.gz ${{ matrix.artifact }})
          sha256sum dist/${{ matrix.artifact }}.tar.gz > dist/${{ matrix.artifact }}.tar.gz.sha256
      - name: Package (windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $stage = "dist/${{ matrix.artifact }}"
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          Copy-Item target/release/tomorrowci.exe $stage/
          Copy-Item README.md,LICENSE,CHANGELOG.md $stage/
          Compress-Archive -Path $stage -DestinationPath "dist/${{ matrix.artifact }}.zip"
          Get-FileHash "dist/${{ matrix.artifact }}.zip" -Algorithm SHA256 |
            ForEach-Object { "$($_.Hash.ToLower())  ${{ matrix.artifact }}.zip" } |
            Set-Content "dist/${{ matrix.artifact }}.zip.sha256"
      - name: SBOM (cargo)
        if: runner.os == 'Linux'
        run: |
          cargo install cargo-cyclonedx --locked || true
          cargo cyclonedx -f json -o dist/sbom.cdx.json || echo '{"bomFormat":"CycloneDX","specVersion":"1.5","note":"cyclonedx unavailable"}' > dist/sbom.cdx.json
      - uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08 # v4.6.0
        with:
          name: ${{ matrix.artifact }}
          path: dist/*

  publish:
    needs: build
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || inputs.dry_run == false
    steps:
      - uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v4.1.8
        with:
          path: artifacts
      - name: List artifacts
        run: find artifacts -type f | sort
      - name: Create release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@c95fe1489396fe8a9eb87c0abf8aa5b2ef267fda # v2.2.1
        with:
          files: artifacts/**/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

version: 1
project:
  ecosystem: python
  test_command: python -m pytest -q
  build_command: auto
baseline:
  runtime: "3.9"
  dependencies: locked
candidates:
  runtime:
    channels: [stable]
    max_versions: 3
  dependencies:
    latest_allowed: false
    prerelease: false
execution:
  max_scenarios: 8
  timeout_seconds: 300
  reruns_on_failure: 2
  max_parallel: 1
sandbox:
  engine: auto
  network: fetch-only
  memory_mb: 2048
  cpus: 1
  pids_limit: 256
report:
  html: true
  json: true

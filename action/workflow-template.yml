# Generated by `tomorrowci init-action`
# Pin third-party actions by commit SHA before production use.
name: tomorrowci
on:
  pull_request:
  push:
    branches: [main, master]
permissions:
  contents: read
jobs:
  tomorrowci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Build CLI
        run: cargo build -p tomorrowci-cli --release
      - name: Trust behaviors
        run: ./target/release/tomorrowci trust
      - name: Scan Python fixture
        run: |
          ./target/release/tomorrowci scan fixtures/python-runtime-break || true
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tomorrowci-evidence
          path: .tomorrowci/runs/
      - name: Job summary from last run
        if: always()
        run: |
          RUN=$(ls -1dt .tomorrowci/runs/* 2>/dev/null | head -1 || true)
          if [[ -n "$RUN" && -f "$RUN/job-summary.md" ]]; then
            cat "$RUN/job-summary.md" >> "$GITHUB_STEP_SUMMARY"
          fi

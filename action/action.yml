name: TomorrowCI
description: Scan a repository for future breakage horizons with replayable evidence
branding:
  icon: activity
  color: purple
inputs:
  target:
    description: Path to scan
    required: false
    default: "."
  evidence-root:
    description: Evidence output directory
    required: false
    default: ".tomorrowci"
  config:
    description: Optional config path
    required: false
    default: ""
runs:
  using: composite
  steps:
    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable
    - name: Build TomorrowCI
      shell: bash
      run: cargo build -p tomorrowci --release
    - name: Doctor
      shell: bash
      run: ./target/release/tomorrowci doctor || true
    - name: Scan
      shell: bash
      run: |
        set +e
        EXTRA=()
        if [ -n "${{ inputs.config }}" ]; then EXTRA+=(--config "${{ inputs.config }}"); fi
        ./target/release/tomorrowci scan "${{ inputs.target }}" --evidence-root "${{ inputs.evidence-root }}" "${EXTRA[@]}"
        code=$?
        {
          echo "## TomorrowCI"
          echo "Target: \`${{ inputs.target }}\`"
          echo "Exit code: $code"
          echo "BLOCKED/INCONCLUSIVE are never treated as PASS."
          if [ -d "${{ inputs.evidence-root }}/runs" ]; then
            echo "Runs:"
            ls "${{ inputs.evidence-root }}/runs" || true
          fi
        } >> "$GITHUB_STEP_SUMMARY"
        exit 0
    - name: Upload evidence
      if: always()
      uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08 # v4.6.0
      with:
        name: tomorrowci-evidence
        path: ${{ inputs.evidence-root }}/runs/

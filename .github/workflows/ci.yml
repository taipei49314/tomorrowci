name: CI

on:
  pull_request:
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: fmt
        run: cargo fmt --all -- --check
      - name: clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: test
        run: cargo test --workspace
      - name: release build
        run: cargo build -p tomorrowci --release
      - name: doctor
        run: ./target/release/tomorrowci doctor || true

  container-integration:
    runs-on: ubuntu-latest
    needs: rust
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: dtolnay/rust-toolchain@stable
      - name: build
        run: cargo build -p tomorrowci --release
      - name: measure all (instruments → trust)
        run: ./target/release/tomorrowci measure all --out .tomorrowci/measure --evidence-root .tomorrowci
      - name: upload evidence
        if: always()
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08 # v4.6.0
        with:
          name: tomorrowci-ci-evidence
          path: |
            .tomorrowci/runs/
            .tomorrowci/measure/

  action-dogfood:
    runs-on: ubuntu-latest
    needs: rust
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Run composite action
        uses: ./action
        with:
          target: fixtures/python-runtime-break

  schema:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: schema present
        run: test -f packages/schema/config-v1.json

name: ci

on:
  push:
    branches: [main, master, "repair/**"]
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # action implementation
        with:
          toolchain: 1.97.1
          components: rustfmt, clippy
      - name: text encoding
        run: python3 scripts/check-text-encoding.py
      - name: version and release metadata contracts
        run: |
          set -euo pipefail
          python3 scripts/check_actions_pinned.py
          python3 scripts/version_contract.py
          python3 scripts/test_release_metadata.py
          python3 scripts/test_release_candidate.py
          python3 scripts/test_container_contract.py
          python3 scripts/test_import_python_dependencies.py
          python3 scripts/test_python_trial_runner.py
          python3 scripts/test_oci_candidate.py
          python3 scripts/test_historical_regressions.py
          python3 scripts/test_config_schema.py
          python3 scripts/test_external_authorization.py
          python3 scripts/test_external_policy_transport.py
          python3 scripts/test_tag_promotion_attestation.py
          python3 scripts/test_external_target_preregistration.py
          python3 scripts/test_external_observation.py
          python3 scripts/test_external_evidence.py
          python3 scripts/test_promotion_preflight.py
          python3 scripts/test_promotion_platform.py
          python3 scripts/test_platform_qualification.py
          python3 scripts/generate_sbom.py --output /tmp/sbom.cdx.json
      - name: fmt
        run: cargo fmt --all -- --check
      - name: clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: test
        run: cargo test --workspace
      - name: build release CLI
        run: cargo build -p tomorrowci-cli --release
      - name: node report helpers
        run: node --test packages/report-ui/test/*.test.js
      - name: bash -n release dry-run
        run: bash -n scripts/release-dry-run.sh
      - name: version identity
        run: |
          set -euo pipefail
          VERSION="$(python3 scripts/version_contract.py)"
          test "$(./target/release/tomorrowci --version)" = "tomorrowci $VERSION"
      - name: trust audit
        run: ./target/release/tomorrowci trust
      - name: doctor
        run: ./target/release/tomorrowci doctor

  windows-pr-runtime:
    if: github.event_name == 'pull_request'
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 1
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # action implementation
        with:
          toolchain: 1.97.1
          targets: x86_64-pc-windows-msvc
      - name: Verify exact PR head
        shell: pwsh
        run: |
          $expected = "${{ github.event.pull_request.head.sha }}"
          $actual = (git rev-parse HEAD).Trim()
          if ($LASTEXITCODE -ne 0) { throw "cannot resolve checked-out source identity" }
          if ($actual -ne $expected) { throw "checkout is not the exact PR head: $actual" }
          $status = @(git status --porcelain --untracked-files=all)
          if ($LASTEXITCODE -ne 0) { throw "cannot inspect PR-head worktree state" }
          if ($status.Count -ne 0) {
            throw "PR-head checkout is not clean"
          }
      - name: Build and inspect non-publishing Windows runtime candidate
        shell: pwsh
        env:
          CARGO_INCREMENTAL: "0"
          SOURCE_DATE_EPOCH: "0"
          RUSTFLAGS: "-C link-arg=/Brepro -C target-feature=+crt-static"
        run: |
          $targetDir = Join-Path $env:RUNNER_TEMP "tomorrowci-pr-head-runtime"
          if (Test-Path -LiteralPath $targetDir) {
            throw "non-clean target directory: $targetDir"
          }
          $env:CARGO_TARGET_DIR = $targetDir
          cargo build -p tomorrowci-cli --release --locked `
            --target x86_64-pc-windows-msvc
          if ($LASTEXITCODE -ne 0) { throw "exact PR-head MSVC build failed" }

          $binary = Join-Path $targetDir `
            "x86_64-pc-windows-msvc\release\tomorrowci.exe"
          & scripts/verify-windows-runtime.ps1 -Binary $binary

          # This is a command/JSON smoke only. It grants no release, promotion,
          # result-authority, or publication state.
          $trustJson = (& $binary trust --json | Out-String)
          if ($LASTEXITCODE -ne 0) { throw "trust --json smoke failed" }
          $trust = $trustJson | ConvertFrom-Json -ErrorAction Stop
          if ($null -eq $trust.overall -or $null -eq $trust.probes) {
            throw "trust --json smoke returned an incomplete document"
          }
          Write-Output $trustJson

  report-ui:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: packages/report-ui/package-lock.json
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # action implementation
        with:
          toolchain: 1.97.1
      - name: Install report dependencies
        working-directory: packages/report-ui
        run: npm ci
      - name: Verify generated assets, types, and unit behavior
        working-directory: packages/report-ui
        run: npm run verify
      - name: Install Chromium
        working-directory: packages/report-ui
        run: npx playwright install --with-deps chromium
      - name: Browser accessibility, responsive, XSS, and no-JS gates
        working-directory: packages/report-ui
        run: npm run test:e2e
      - name: Rust report model and renderer
        run: cargo test -p tomorrowci-report --all-targets

  live-python:
    runs-on: ubuntu-latest
    needs: rust
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # action implementation
        with:
          toolchain: 1.97.1
      - name: build release CLI
        run: cargo build -p tomorrowci-cli --release
      - name: live Docker Python fixture
        id: live
        run: |
          set -euo pipefail
          FIXTURE=fixtures/python-runtime-break
          ./target/release/tomorrowci doctor
          ./target/release/tomorrowci scan "$FIXTURE" \
            --config "$FIXTURE/.tomorrowci.yml" | tee /tmp/scan.out
          if grep -q "verdict: BLOCKED" /tmp/scan.out; then
            echo "Live scan BLOCKED"
            exit 2
          fi
          RUN_ID=$(sed -n 's/^run_id: //p' /tmp/scan.out | tail -1)
          RUN_DIR="$FIXTURE/.tomorrowci/runs/$RUN_ID"
          test -d "$RUN_DIR"
          echo "run_dir=$RUN_DIR" >> "$GITHUB_OUTPUT"
          echo "run_id=$RUN_ID" >> "$GITHUB_OUTPUT"
          ./target/release/tomorrowci verify "$RUN_ID" || (cd "$FIXTURE" && ../../target/release/tomorrowci verify "$RUN_ID")
          python3 - <<PY
          import json
          run_dir = "$RUN_DIR"
          f = json.load(open(f"{run_dir}/frontier.json"))
          assert f.get("observed") is True, f
          m = json.load(open(f"{run_dir}/run.json"))
          assert m.get("repository", {}).get("commit_sha")
          for r in m["results"]:
              env = r.get("environment") or {}
              assert env.get("image_digest"), r
              tag = env.get("image_tag") or env.get("image")
              assert tag and "sha256:" not in tag, env
              assert "scripted-test-digest" not in str(env.get("image_digest"))
          print("live_identity_ok", m["run_id"], m["repository"]["commit_sha"])
          PY
      - name: replay equivalence twice
        working-directory: fixtures/python-runtime-break
        run: |
          set -euo pipefail
          RUN_ID="${{ steps.live.outputs.run_id }}"
          SC=$(python3 -c "import json; print(json.load(open('.tomorrowci/runs/'+'$RUN_ID'+'/frontier.json'))['first_failing_scenario'])")
          "$GITHUB_WORKSPACE/target/release/tomorrowci" replay "$RUN_ID" --scenario "$SC" | tee /tmp/r1.out
          "$GITHUB_WORKSPACE/target/release/tomorrowci" replay "$RUN_ID" --scenario "$SC" | tee /tmp/r2.out
          test -f ".tomorrowci/runs/$RUN_ID/scenarios/$SC/replays/attempt-1/result.json"
          test -f ".tomorrowci/runs/$RUN_ID/scenarios/$SC/replays/attempt-2/result.json"
          grep -q "replay: PASS" /tmp/r1.out
          grep -q "replay: PASS" /tmp/r2.out
          "$GITHUB_WORKSPACE/target/release/tomorrowci" verify "$RUN_ID"
      - name: Upload live evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: tomorrowci-live-python-evidence
          path: fixtures/python-runtime-break/.tomorrowci/runs/
          if-no-files-found: warn

  m2-dependency-fixtures:
    runs-on: ubuntu-latest
    needs: rust
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # action implementation
        with:
          toolchain: 1.97.1
      - name: Build release CLI
        run: cargo build -p tomorrowci-cli --release
      - name: Native content-addressed dependency probes
        run: |
          set -euo pipefail
          python3 scripts/test_dependency_fixtures.py \
            --native \
            --output /tmp/m2-dependency-fixtures.json
      - name: CLI dependency reduction, verify, and replay twice
        run: |
          set -euo pipefail
          mkdir -p /tmp/m2-cli
          CLI="$GITHUB_WORKSPACE/target/release/tomorrowci"

          for ECOSYSTEM in python node rust; do
            FIXTURE="fixtures/dependency-$ECOSYSTEM"
            "$CLI" scan "$FIXTURE" \
              --config "$FIXTURE/.tomorrowci.yml" \
              | tee "/tmp/m2-cli/$ECOSYSTEM-scan.out"
            if grep -Eq '^verdict: (BLOCKED|UNSUPPORTED|INCONCLUSIVE|BASELINE_INVALID|FLAKY)$' \
              "/tmp/m2-cli/$ECOSYSTEM-scan.out"; then
              echo "$ECOSYSTEM dependency scan did not produce authoritative evidence"
              exit 2
            fi

            RUN_ID="$(sed -n 's/^run_id: //p' "/tmp/m2-cli/$ECOSYSTEM-scan.out" | tail -1)"
            test -n "$RUN_ID"
            RUN_DIR="$FIXTURE/.tomorrowci/runs/$RUN_ID"
            test -d "$RUN_DIR"
            test -f "$RUN_DIR/reduction.json"
            (cd "$FIXTURE" && "$CLI" verify "$RUN_ID")

            SCENARIO="$(python3 - "$RUN_DIR/reduction.json" \
              "$RUN_DIR/dependency-experiment.json" \
              "$FIXTURE/fixture-oracle.json" <<'PY'
          import json
          import sys

          reduction = json.load(open(sys.argv[1], encoding="utf-8"))
          trusted = json.load(open(sys.argv[2], encoding="utf-8"))
          oracle = json.load(open(sys.argv[3], encoding="utf-8"))

          forbidden = {
              "authoritative",
              "required",
              "required_change_ids",
              "irrelevant_change_ids",
              "expected_minimal_change_ids",
              "expected_probes",
              "expected_verdict",
              "probes",
          }

          def assert_oracle_free(value):
              if isinstance(value, dict):
                  leaked = forbidden.intersection(value)
                  assert not leaked, f"trusted manifest leaked fixture oracle fields: {sorted(leaked)}"
                  for nested in value.values():
                      assert_oracle_free(nested)
              elif isinstance(value, list):
                  for nested in value:
                      assert_oracle_free(nested)

          assert_oracle_free(trusted)
          assert oracle["authoritative"] is False
          expected = sorted(oracle["expected_minimal_change_ids"])
          actual = sorted(change["id"] for change in reduction["minimal_changes"])
          assert reduction["status"] == "PROVEN_MINIMAL", reduction
          assert reduction["authority"] == "OBSERVED", reduction
          assert reduction["stable_failure_hash"], reduction
          assert actual == expected, (actual, expected)

          required = set(oracle["required_change_ids"])
          irrelevant = set(oracle["irrelevant_change_ids"])
          subtraction = {
              check["removed_change_id"]
              for check in reduction["subtraction_probes"]
              if check["necessary"] and check["authority"] == "OBSERVED"
          }
          addition = {
              check["added_change_id"]
              for check in reduction["addition_probes"]
              if check["irrelevant"] and check["authority"] == "OBSERVED"
          }
          assert required.issubset(subtraction), (required, subtraction)
          assert irrelevant.issubset(addition), (irrelevant, addition)

          matches = [
              probe
              for probe in reduction["probes"]
              if sorted(probe["change_ids"]) == expected
              and probe["verdict"] == "FAIL"
              and probe["authority"] == "OBSERVED"
          ]
          assert matches, reduction["probes"]
          print(matches[0]["scenario_id"])
          PY
            )"
            test -n "$SCENARIO"

            (
              cd "$FIXTURE"
              "$CLI" replay "$RUN_ID" --scenario "$SCENARIO" \
                | tee "/tmp/m2-cli/$ECOSYSTEM-replay-1.out"
              "$CLI" replay "$RUN_ID" --scenario "$SCENARIO" \
                | tee "/tmp/m2-cli/$ECOSYSTEM-replay-2.out"
              grep -q 'replay: PASS' "/tmp/m2-cli/$ECOSYSTEM-replay-1.out"
              grep -q 'replay: PASS' "/tmp/m2-cli/$ECOSYSTEM-replay-2.out"
              test -f ".tomorrowci/runs/$RUN_ID/scenarios/$SCENARIO/replays/attempt-1/result.json"
              test -f ".tomorrowci/runs/$RUN_ID/scenarios/$SCENARIO/replays/attempt-2/result.json"
              "$CLI" verify "$RUN_ID"
            )
          done
      - name: Upload M2 dependency evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: tomorrowci-m2-dependency-evidence
          path: |
            /tmp/m2-dependency-fixtures.json
            /tmp/m2-cli/
            fixtures/dependency-python/.tomorrowci/runs/
            fixtures/dependency-node/.tomorrowci/runs/
            fixtures/dependency-rust/.tomorrowci/runs/
          include-hidden-files: true
          if-no-files-found: warn

  live-node:
    runs-on: ubuntu-latest
    needs: rust
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # action implementation
        with:
          toolchain: 1.97.1
      - name: Build release CLI
        run: cargo build -p tomorrowci-cli --release
      - name: Live Node 20 to 22 runtime horizon
        id: live
        run: |
          set -euo pipefail
          CLI="$GITHUB_WORKSPACE/target/release/tomorrowci"
          FIXTURE=fixtures/node-dependency-break
          BEFORE="$(python3 scripts/test_m3_evidence.py tree-hash "$FIXTURE")"

          "$CLI" doctor
          "$CLI" scan "$FIXTURE" --config "$FIXTURE/.tomorrowci.yml" \
            | tee /tmp/m3-node-scan.out
          if grep -Eq '^verdict: (BLOCKED|UNSUPPORTED|INCONCLUSIVE|BASELINE_INVALID|FLAKY)$' \
            /tmp/m3-node-scan.out; then
            echo "Node runtime scan did not produce authoritative evidence"
            exit 2
          fi

          RUN_ID="$(sed -n 's/^run_id: //p' /tmp/m3-node-scan.out | tail -1)"
          test -n "$RUN_ID"
          RUN_DIR="$FIXTURE/.tomorrowci/runs/$RUN_ID"
          test -d "$RUN_DIR"
          (cd "$FIXTURE" && "$CLI" verify "$RUN_ID")
          python3 scripts/test_m3_evidence.py assert-live \
            --fixture "$FIXTURE" --run-id "$RUN_ID" \
            --ecosystem node --baseline 20 --candidate 22 \
            --manager npm --lockfile package-lock.json \
            --failure-kind RemovedRuntimeApi --require-clean

          SCENARIO="$(python3 - "$RUN_DIR/frontier.json" <<'PY'
          import json
          import sys
          value = json.load(open(sys.argv[1], encoding="utf-8"))["first_failing_scenario"]
          if not value:
              raise SystemExit("Node frontier has no failing scenario")
          print(value)
          PY
          )"
          (
            cd "$FIXTURE"
            "$CLI" replay "$RUN_ID" --scenario "$SCENARIO" | tee /tmp/m3-node-replay-1.out
            "$CLI" replay "$RUN_ID" --scenario "$SCENARIO" | tee /tmp/m3-node-replay-2.out
            grep -q 'replay: PASS' /tmp/m3-node-replay-1.out
            grep -q 'replay: PASS' /tmp/m3-node-replay-2.out
            "$CLI" verify "$RUN_ID"
          )
          python3 scripts/test_m3_evidence.py assert-live \
            --fixture "$FIXTURE" --run-id "$RUN_ID" \
            --ecosystem node --baseline 20 --candidate 22 \
            --manager npm --lockfile package-lock.json \
            --failure-kind RemovedRuntimeApi --require-clean --replays 2

          AFTER="$(python3 scripts/test_m3_evidence.py tree-hash "$FIXTURE")"
          test "$BEFORE" = "$AFTER"
          echo "run_id=$RUN_ID" >> "$GITHUB_OUTPUT"
      - name: Upload live Node evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: tomorrowci-m3-live-node-evidence
          path: |
            /tmp/m3-node-*.out
            fixtures/node-dependency-break/.tomorrowci/runs/
          include-hidden-files: true
          if-no-files-found: error

  live-rust:
    runs-on: ubuntu-latest
    needs: rust
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # action implementation
        with:
          toolchain: 1.97.1
      - name: Build release CLI
        run: cargo build -p tomorrowci-cli --release
      - name: Live Rust declared-MSRV compatibility horizon
        id: live
        run: |
          set -euo pipefail
          CLI="$GITHUB_WORKSPACE/target/release/tomorrowci"
          FIXTURE=fixtures/rust-msrv-break
          BEFORE="$(python3 scripts/test_m3_evidence.py tree-hash "$FIXTURE")"

          "$CLI" doctor
          "$CLI" scan "$FIXTURE" --config "$FIXTURE/.tomorrowci.yml" \
            | tee /tmp/m3-rust-scan.out
          if grep -Eq '^verdict: (BLOCKED|UNSUPPORTED|INCONCLUSIVE|BASELINE_INVALID|FLAKY)$' \
            /tmp/m3-rust-scan.out; then
            echo "Rust MSRV scan did not produce authoritative evidence"
            exit 2
          fi

          RUN_ID="$(sed -n 's/^run_id: //p' /tmp/m3-rust-scan.out | tail -1)"
          test -n "$RUN_ID"
          RUN_DIR="$FIXTURE/.tomorrowci/runs/$RUN_ID"
          test -d "$RUN_DIR"
          (cd "$FIXTURE" && "$CLI" verify "$RUN_ID")
          python3 scripts/test_m3_evidence.py assert-live \
            --fixture "$FIXTURE" --run-id "$RUN_ID" \
            --ecosystem rust --baseline 1.83 --candidate 1.74 \
            --manager cargo --lockfile Cargo.lock \
            --failure-kind MsrvError --require-clean

          SCENARIO="$(python3 - "$RUN_DIR/frontier.json" <<'PY'
          import json
          import sys
          value = json.load(open(sys.argv[1], encoding="utf-8"))["first_failing_scenario"]
          if not value:
              raise SystemExit("Rust frontier has no failing scenario")
          print(value)
          PY
          )"
          (
            cd "$FIXTURE"
            "$CLI" replay "$RUN_ID" --scenario "$SCENARIO" | tee /tmp/m3-rust-replay-1.out
            "$CLI" replay "$RUN_ID" --scenario "$SCENARIO" | tee /tmp/m3-rust-replay-2.out
            grep -q 'replay: PASS' /tmp/m3-rust-replay-1.out
            grep -q 'replay: PASS' /tmp/m3-rust-replay-2.out
            "$CLI" verify "$RUN_ID"
          )
          python3 scripts/test_m3_evidence.py assert-live \
            --fixture "$FIXTURE" --run-id "$RUN_ID" \
            --ecosystem rust --baseline 1.83 --candidate 1.74 \
            --manager cargo --lockfile Cargo.lock \
            --failure-kind MsrvError --require-clean --replays 2

          AFTER="$(python3 scripts/test_m3_evidence.py tree-hash "$FIXTURE")"
          test "$BEFORE" = "$AFTER"
          echo "run_id=$RUN_ID" >> "$GITHUB_OUTPUT"
      - name: Upload live Rust evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: tomorrowci-m3-live-rust-evidence
          path: |
            /tmp/m3-rust-*.out
            fixtures/rust-msrv-break/.tomorrowci/runs/
          include-hidden-files: true
          if-no-files-found: error

  m3-negative-controls:
    runs-on: ubuntu-latest
    needs: [live-node, live-rust]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # action implementation
        with:
          toolchain: 1.97.1
      - name: Build release CLI
        run: cargo build -p tomorrowci-cli --release
      - name: Baseline-invalid, flaky, and blocked do not authorize a horizon
        run: |
          set -euo pipefail
          CLI="$GITHUB_WORKSPACE/target/release/tomorrowci"
          NODE_FIXTURE=fixtures/node-dependency-break
          RUST_FIXTURE=fixtures/rust-msrv-break

          set +e
          "$CLI" scan "$NODE_FIXTURE" \
            --config "$NODE_FIXTURE/.tomorrowci-baseline-invalid.yml" \
            > /tmp/m3-baseline-invalid.out 2>&1
          BASELINE_STATUS=$?
          "$CLI" scan "$NODE_FIXTURE" \
            --config "$NODE_FIXTURE/.tomorrowci-flaky.yml" \
            > /tmp/m3-flaky.out 2>&1
          FLAKY_STATUS=$?
          DOCKER_HOST=unix:///tmp/tomorrowci-engine-does-not-exist.sock \
            "$CLI" scan "$RUST_FIXTURE" \
            --config "$RUST_FIXTURE/.tomorrowci-blocked.yml" \
            > /tmp/m3-blocked.out 2>&1
          BLOCKED_STATUS=$?
          set -e

          test "$BASELINE_STATUS" -eq 2
          test "$FLAKY_STATUS" -eq 2
          test "$BLOCKED_STATUS" -eq 2

          for CASE in baseline-invalid flaky blocked; do
            RUN_ID="$(sed -n 's/^run_id: //p' "/tmp/m3-$CASE.out" | tail -1)"
            test -n "$RUN_ID"
            if test "$CASE" = blocked; then
              FIXTURE="$RUST_FIXTURE"
            else
              FIXTURE="$NODE_FIXTURE"
            fi
            (cd "$FIXTURE" && "$CLI" verify "$RUN_ID")
            python3 scripts/test_m3_evidence.py assert-negative \
              --fixture "$FIXTURE" --run-id "$RUN_ID" --expected "$CASE"
          done
      - name: Upload M3 negative-control evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: tomorrowci-m3-negative-control-evidence
          path: |
            /tmp/m3-baseline-invalid.out
            /tmp/m3-flaky.out
            /tmp/m3-blocked.out
            fixtures/node-dependency-break/.tomorrowci/runs/
            fixtures/rust-msrv-break/.tomorrowci/runs/
          include-hidden-files: true
          if-no-files-found: error

  action-dogfood:
    runs-on: ubuntu-latest
    needs: rust
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # action implementation
        with:
          toolchain: 1.97.1
      - name: Dogfood checked-in Action
        uses: ./action
        with:
          path: fixtures/python-runtime-break
          config: fixtures/python-runtime-break/.tomorrowci.yml
          advisory: "false"
          expect-horizon: "true"

  action-consumer:
    runs-on: ubuntu-latest
    needs: rust
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: tomorrowci-src
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # action implementation
        with:
          toolchain: 1.97.1
      - name: Create real consumer git repository
        run: |
          set -euo pipefail
          mkdir -p consumer
          cp -a tomorrowci-src/fixtures/python-runtime-break/. consumer/
          test ! -f consumer/Cargo.toml
          cd consumer
          git init
          git config user.email "ci@tomorrowci.local"
          git config user.name "TomorrowCI CI"
          git add .
          git commit -m fixture
      - name: Invoke Action against consumer repository
        uses: ./tomorrowci-src/action
        with:
          path: consumer
          config: consumer/.tomorrowci.yml
          advisory: "false"
          expect-horizon: "true"

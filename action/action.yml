name: TomorrowCI
description: Scan for future breakage horizons; optional base/head horizon compare
branding:
  icon: activity
  color: purple
inputs:
  target:
    description: Path to scan
    required: false
    default: "."
  evidence-root:
    description: Evidence output directory
    required: false
    default: ".tomorrowci"
  config:
    description: Optional config path
    required: false
    default: ""
  base-ref:
    description: Optional git ref to scan as base for horizon compare (e.g. origin/main)
    required: false
    default: ""
  fail-on-regression:
    description: Fail the job when head horizon regresses vs base
    required: false
    default: "false"
  run-policy:
    description: Run tomorrowci policy on head (optional base) after scan
    required: false
    default: "true"
  advisory:
    description: If true, scan failures do not fail the step (evidence still uploaded)
    required: false
    default: "true"
outputs:
  head-run-dir:
    description: Path to evidence runs directory
    value: ${{ inputs.evidence-root }}/runs
runs:
  using: composite
  steps:
    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable

    - name: Build TomorrowCI
      shell: bash
      run: cargo build -p tomorrowci --release

    - name: Doctor
      shell: bash
      run: ./target/release/tomorrowci doctor || true

    - name: Scan head
      id: scan_head
      shell: bash
      run: |
        set +e
        EXTRA=()
        if [ -n "${{ inputs.config }}" ]; then EXTRA+=(--config "${{ inputs.config }}"); fi
        ./target/release/tomorrowci scan "${{ inputs.target }}" --evidence-root "${{ inputs.evidence-root }}" "${EXTRA[@]}"
        code=$?
        echo "scan_exit=$code" >> "$GITHUB_OUTPUT"
        HEAD_RUN=$(ls -1t "${{ inputs.evidence-root }}/runs" 2>/dev/null | head -1 || true)
        echo "head_run=$HEAD_RUN" >> "$GITHUB_OUTPUT"
        {
          echo "## TomorrowCI (head)"
          echo "Target: \`${{ inputs.target }}\`"
          echo "Scan exit: $code"
          echo "Head run: \`$HEAD_RUN\`"
          echo "BLOCKED/INCONCLUSIVE are never treated as PASS."
        } >> "$GITHUB_STEP_SUMMARY"
        if [ "${{ inputs.advisory }}" = "true" ]; then exit 0; fi
        exit "$code"

    - name: Scan base ref (optional)
      id: scan_base
      if: ${{ inputs.base-ref != '' }}
      shell: bash
      run: |
        set +e
        BASE_REF="${{ inputs.base-ref }}"
        WORK="${{ inputs.evidence-root }}/work/base-checkout"
        rm -rf "$WORK"
        git worktree add --detach "$WORK" "$BASE_REF" || git clone --depth 1 . "$WORK"
        EXTRA=()
        if [ -n "${{ inputs.config }}" ] && [ -f "${{ inputs.config }}" ]; then
          EXTRA+=(--config "${{ inputs.config }}")
        fi
        ./target/release/tomorrowci scan "$WORK" --evidence-root "${{ inputs.evidence-root }}" "${EXTRA[@]}"
        code=$?
        BASE_RUN=$(ls -1t "${{ inputs.evidence-root }}/runs" 2>/dev/null | head -1 || true)
        # Prefer the run that is not head_run if both exist
        HEAD_RUN="${{ steps.scan_head.outputs.head_run }}"
        for d in $(ls -1t "${{ inputs.evidence-root }}/runs" 2>/dev/null); do
          if [ "$d" != "$HEAD_RUN" ]; then BASE_RUN="$d"; break; fi
        done
        echo "base_run=$BASE_RUN" >> "$GITHUB_OUTPUT"
        {
          echo "## TomorrowCI (base \`$BASE_REF\`)"
          echo "Base run: \`$BASE_RUN\` (scan exit $code)"
        } >> "$GITHUB_STEP_SUMMARY"
        exit 0

    - name: Compare horizons
      if: ${{ inputs.base-ref != '' && steps.scan_base.outputs.base_run != '' && steps.scan_head.outputs.head_run != '' }}
      shell: bash
      run: |
        set +e
        BASE="${{ steps.scan_base.outputs.base_run }}"
        HEAD="${{ steps.scan_head.outputs.head_run }}"
        FAIL_FLAG=()
        if [ "${{ inputs.fail-on-regression }}" = "true" ]; then
          FAIL_FLAG+=(--fail-on-regression)
        fi
        ./target/release/tomorrowci compare "$BASE" "$HEAD" --evidence-root "${{ inputs.evidence-root }}" "${FAIL_FLAG[@]}"
        code=$?
        {
          echo "## Horizon compare"
          echo "base=\`$BASE\` head=\`$HEAD\` exit=$code"
          if [ -f "${{ inputs.evidence-root }}/compare-${BASE}-${HEAD}.json" ]; then
            echo '```json'
            cat "${{ inputs.evidence-root }}/compare-${BASE}-${HEAD}.json"
            echo '```'
          fi
        } >> "$GITHUB_STEP_SUMMARY"
        if [ "${{ inputs.fail-on-regression }}" = "true" ] && [ "$code" -eq 5 ]; then
          exit 5
        fi
        exit 0

    - name: Policy gate
      if: ${{ inputs.run-policy == 'true' && steps.scan_head.outputs.head_run != '' }}
      shell: bash
      run: |
        set +e
        HEAD="${{ steps.scan_head.outputs.head_run }}"
        BASE="${{ steps.scan_base.outputs.base_run }}"
        EXTRA=()
        if [ -n "$BASE" ]; then EXTRA+=(--base "$BASE"); fi
        ./target/release/tomorrowci policy "$HEAD" --evidence-root "${{ inputs.evidence-root }}" "${EXTRA[@]}"
        code=$?
        {
          echo "## Policy"
          echo "exit=$code (6 = policy FAIL)"
        } >> "$GITHUB_STEP_SUMMARY"
        if [ "${{ inputs.advisory }}" = "true" ]; then exit 0; fi
        exit "$code"

    - name: Upload evidence
      if: always()
      uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08 # v4.6.0
      with:
        name: tomorrowci-evidence
        path: |
          ${{ inputs.evidence-root }}/runs/
          ${{ inputs.evidence-root }}/compare-*.json
          ${{ inputs.evidence-root }}/policy-*.json

version: 1
project:
  ecosystem: node
  test_command: npm test
baseline:
  runtime: "20"
  dependencies: locked
candidates:
  runtime:
    channels: [stable]
    max_versions: 2
  dependencies:
    latest_allowed: true
    prerelease: false
execution:
  max_scenarios: 8
  timeout_seconds: 300
  reruns_on_failure: 2
sandbox:
  engine: auto
  memory_mb: 2048
  cpus: 1
  pids_limit: 256
report:
  html: true
  json: true
